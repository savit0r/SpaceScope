<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Deep Space Radial Glow -->
    <radialGradient id="spaceAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a47" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#051326" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020813" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Core Gradient -->
    <radialGradient id="corePlanet" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#BEE7FF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="78%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#082545"/>
    </radialGradient>

    <!-- Solar / Atmospheric Corona Rim -->
    <radialGradient id="coronaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Orbital Ring Gradient -->
    <linearGradient id="orbitGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Secondary Orbital Ring Gradient -->
    <linearGradient id="orbitGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Scope Targeting Gradients -->
    <linearGradient id="scopeLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Backdrop Disc -->
  <circle cx="50" cy="50" r="48" fill="#030712" stroke="#1E293B" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="48" fill="url(#spaceAtmosphere)"/>

  <!-- Outer Scope Reticle Ring -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 3"/>

  <!-- Scope Cardinal Crosshair Marks -->
  <line x1="50" y1="5" x2="50" y2="14" stroke="url(#scopeLineGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="86" x2="50" y2="95" stroke="url(#scopeLineGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="50" x2="14" y2="50" stroke="url(#scopeLineGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="50" x2="95" y2="50" stroke="url(#scopeLineGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Sub-cardinal Precision Ticks -->
  <circle cx="21" cy="21" r="1" fill="#38BDF8" fill-opacity="0.5"/>
  <circle cx="79" cy="21" r="1" fill="#38BDF8" fill-opacity="0.5"/>
  <circle cx="21" cy="79" r="1" fill="#38BDF8" fill-opacity="0.5"/>
  <circle cx="79" cy="79" r="1" fill="#38BDF8" fill-opacity="0.5"/>

  <!-- Secondary Counter-Tilted Orbital Path -->
  <ellipse cx="50" cy="50" rx="35" ry="13" fill="none" stroke="url(#orbitGradSecondary)" stroke-width="1.2" stroke-dasharray="5 3" transform="rotate(35 50 50)"/>

  <!-- Secondary Orbit Node Beacon -->
  <circle cx="23" cy="69" r="1.8" fill="#A5B4FC" filter="url(#neonGlow)"/>

  <!-- Primary Keplerian Elliptical Orbit (Behind Planet) -->
  <ellipse cx="50" cy="50" rx="37" ry="14.5" fill="none" stroke="url(#orbitGradPrimary)" stroke-width="2.2" transform="rotate(-28 50 50)"/>

  <!-- Central Celestial Atmospheric Corona -->
  <circle cx="50" cy="50" r="21" fill="url(#coronaGlow)"/>

  <!-- Central Planet Body -->
  <circle cx="50" cy="50" r="14" fill="url(#corePlanet)"/>

  <!-- Planet Day/Night Terminator (Physical Shadow) -->
  <path d="M 50 36 A 14 14 0 0 1 50 64 A 10 14 0 0 0 50 36 Z" fill="#020817" fill-opacity="0.68"/>

  <!-- Planet Specular Highlight -->
  <ellipse cx="45" cy="43" rx="4" ry="2" fill="#FFFFFF" fill-opacity="0.75" transform="rotate(-30 45 43)"/>

  <!-- Primary Orbit Satellite / Planet Node Beacon -->
  <g transform="rotate(-28 50 50)">
    <!-- Halo -->
    <circle cx="87" cy="50" r="5" fill="#38BDF8" fill-opacity="0.35"/>
    <!-- Outer Ring -->
    <circle cx="87" cy="50" r="3.2" fill="#0284C7" stroke="#E0F2FE" stroke-width="1"/>
    <!-- Bright Core -->
    <circle cx="87" cy="50" r="1.6" fill="#FFFFFF" filter="url(#neonGlow)"/>
  </g>

  <!-- Center Scope Reticle Target Pin -->
  <circle cx="50" cy="50" r="2" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.8"/>
  <circle cx="50" cy="50" r="0.8" fill="#38BDF8"/>
</svg>
